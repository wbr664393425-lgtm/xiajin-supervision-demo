limit_req_zone $binary_remote_addr zone=xiajin_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=xiajin_chat:1m rate=18r/m;
upstream xiajin_session_api { server unix:/run/xiajin-supervision/api.sock; }

server {
    listen 127.0.0.1:1020;
    server_name br20.xiaoyuqi.top;
    root /opt/wbr/xiajin-supervision-demo/current/public;
    access_log /var/log/nginx/xiajin-supervision.access.log;
    error_log /var/log/nginx/xiajin-supervision.error.log warn;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    limit_req_status 429;

    location = / { try_files /index.html =404; add_header Cache-Control "no-store" always; }
    location = /index.html { try_files $uri =404; add_header Cache-Control "no-store" always; }
    location = /favicon.svg { try_files $uri =404; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, immutable";
    }
    location = /api/session/login {
        limit_req zone=xiajin_login burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://xiajin_session_api;
    }
    location ~ ^/api/session(/logout)?$ { proxy_pass http://xiajin_session_api; }
    location = /api/llm/chat/completions {
        limit_req zone=xiajin_chat burst=6 nodelay;
        client_max_body_size 128k;
        proxy_buffering off;
        proxy_read_timeout 150s;
        add_header X-Accel-Buffering no always;
        proxy_pass http://xiajin_session_api;
    }
    location / { return 404; }
}
