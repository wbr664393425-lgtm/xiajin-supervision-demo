# 只将本站备用 HTTPS 入口规范为既有登录来源，其他 Origin 原样传递并由 API 校验。
map $http_origin $xiajin_forward_origin {
    default $http_origin;
    "https://br20.xiaoyuqi.top:8443" "https://br20.xiaoyuqi.top";
}

server {
    include /etc/nginx/snippets/mobile-sensitive-guard.conf;
    listen 80;
    listen [::]:80;
    server_name br20.xiaoyuqi.top;
    location / {
        return 301 https://br20.xiaoyuqi.top$request_uri;
    }
}
server {
    include /etc/nginx/snippets/mobile-sensitive-guard.conf;
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 120.224.187.51:8443 ssl;
    server_name br20.xiaoyuqi.top;
    ssl_certificate /etc/nginx/ssl/br13-br20.xiaoyuqi.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/br13-br20.xiaoyuqi.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:1020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $xiajin_forward_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $br13_br20_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
