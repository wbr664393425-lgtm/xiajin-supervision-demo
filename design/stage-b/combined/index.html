<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组合方向 · B案头入口与A材料审阅</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:16px}header{padding:23px 36px;background:#fff;border-bottom:1px solid #dfe5ed;display:flex;align-items:center;justify-content:space-between;gap:30px}h1{font-size:24px;font-weight:600;margin:0 0 8px}p{font-size:15px;line-height:1.8;margin:0;color:#64748b}a{color:#176ad8;text-decoration:none}main{max-width:1580px;margin:auto;padding:30px 36px 45px}.view-choice{display:flex;gap:12px;margin-bottom:22px}.view-choice button{font:inherit;cursor:pointer;padding:11px 20px;border:1px solid #d5dfe9;border-radius:6px;background:#fff;color:#566478}.view-choice button.active{color:#176ad8;background:#edf4ff;border-color:#b8cff0}figure{margin:0 0 37px}.frame{display:block;max-width:1440px;margin:auto}img{display:block;width:100%;height:auto;border:1px solid #dce4ee;background:#fff}figcaption{display:flex;justify-content:space-between;gap:25px;font-size:15px;color:#64748b;margin:14px auto 0;max-width:1440px;line-height:1.8}figcaption strong{font-size:17px;color:#1f2937;font-weight:550}.notice{font-size:14px;border-top:1px solid #dce4ee;padding-top:21px;line-height:1.9;color:#64748b}.hidden{display:none}a:focus-visible,button:focus-visible{outline:3px solid #86b4ee;outline-offset:4px}@media(max-width:800px){header{padding:20px;align-items:flex-start}h1{font-size:20px}main{padding:25px 15px}.view-choice button{padding:10px 13px;font-size:14px}figcaption{display:block}figcaption a{display:block;margin-top:8px}}</style></head><body><header><div><h1>B 的工作入口，A 的材料审阅</h1><p>基于已认可的两张风格稿统一品牌、导航与细节。组合方向已获用户认可，正在阶段 C 进行交互评审。</p></div><a href="../boards.html">返回三案对照 ↗</a></header><main><p style="margin-bottom:23px"><a href="../prototype/">打开已选方向的可点击原型 →</a></p><nav class="view-choice" aria-label="查看视觉稿"><button data-view="all" class="active">两页对照</button><button data-view="entry">工作入口</button><button data-view="work">材料审阅</button></nav><figure data-frame="entry"><a class="frame" href="entry.png"><img src="entry.png" alt="组合稿工作入口，采用B当前工作与续办结构"></a><figcaption><div><strong>01 · 工作入口</strong><br>当前工作稿、上次停点与收到的来件，直接接续日常工作。</div><a href="entry.png">查看完整视觉稿 ↗</a></figcaption></figure><figure data-frame="work"><a class="frame" href="work.png"><img src="work.png" alt="组合稿材料审阅，采用A宽幅原文与随文批注"></a><figcaption><div><strong>02 · 材料审阅</strong><br>原文是主体，提取修订与依据贴着材料出现；保存摘要与提交复核分开。</div><a href="work.png">查看完整视觉稿 ↗</a></figcaption></figure><p class="notice">阶段B · 静态视觉组合稿，非功能原型或浏览器截图。全部案例虚构，生成图中的局部文字字形仍需在原生排版中逐字核对；统一案例原件承租方为“禾川农机服务社”，故意的AI提取错误为“禾田农机服务社”。原系统未修改。阶段 C 原型独立保留于 prototype/；按用户最新要求，实际页面由用户自行验收。</p></main><script>document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el===button));document.querySelectorAll('[data-frame]').forEach(el=>el.classList.toggle('hidden',button.dataset.view!=='all'&&button.dataset.view!==el.dataset.frame));}));</script></body></html>
